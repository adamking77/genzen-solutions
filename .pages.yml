media:
  - name: assets
    label: Media Assets
    input: src/assets
    output: /assets
    path: /assets

content:
  - name: reports
    label: Reports
    type: collection
    path: src/content/reports
    extension: mdx
    fields:
      # Core content fields
      - name: title
        label: Title
        type: string
        required: true
        
      - name: subtitle
        label: Subtitle
        type: string
        
      - name: description
        label: Description
        type: text
        required: true
        
      - name: excerpt
        label: Excerpt
        type: text
        help: Brief summary (max 500 characters)
        
      - name: tldr
        label: TL;DR
        type: text
        help: Quick summary (max 800 characters)
        
      # Publishing info
      - name: author
        label: Author
        type: string
        required: true
        default: "Strategic Analytics Team"
        
      - name: publishDate
        label: Publish Date
        type: string
        help: Format as 'Month YEAR' (e.g., 'December 2024')
        
      # Content classification
      - name: category
        label: Category
        type: select
        required: true
        options:
          - Strategic
          - Financial
          - Market Analysis
          - Technology
          - Performance
          - Regional
          
      - name: tags
        label: Tags
        type: list
        items:
          type: string
        min: 1
        max: 10
        
      # Content metadata
      - name: readTime
        label: Read Time
        type: string
        help: Format as 'X min read' (e.g., '12 min read')
        
      - name: difficulty
        label: Difficulty Level
        type: select
        options:
          - Beginner
          - Intermediate
          - Advanced
          
      - name: language
        label: Language
        type: string
        default: en
        
      # Publishing controls
      - name: published
        label: Published
        type: boolean
        default: true
        
      - name: featured
        label: Featured
        type: boolean
        default: false
        
      - name: draft
        label: Draft
        type: boolean
        default: false
        
      # Media fields
      - name: featuredImage
        label: Featured Image
        type: string
        help: URL to featured image
        
      - name: featuredImageAlt
        label: Featured Image Alt Text
        type: string
        
      - name: socialImage
        label: Social Media Image
        type: string
        help: URL for social sharing
        
      # Optional metadata
      - name: technologies
        label: Technologies
        type: list
        items:
          type: string
          
      - name: services
        label: Services
        type: list
        items:
          type: string
          
      # Analytics
      - name: viewCount
        label: View Count
        type: number
        default: 0
        
      - name: downloadCount
        label: Download Count
        type: number
        default: 0
        
      # Content body
      - name: body
        label: Content
        type: rich-text
        
    # Collection view configuration
    view:
      fields: [title, category, publishDate, featured]
      primary: title
      sort: [publishDate]
      default:
        sort: publishDate
        order: desc