media:
  - name: assets
    label: Media Assets
    input: src/assets
    output: /assets
    path: /assets

content:
  - name: reports
    label: Reports
    type: collection
    path: src/content/reports
    extension: mdx
    fields:
      # Fields that actually exist in your reports
      - name: title
        label: Title
        type: string
        required: true
        
      - name: subtitle
        label: Subtitle
        type: string
        
      - name: description
        label: Description
        type: text
        required: true
        
      - name: author
        label: Author
        type: string
        required: true
        
      - name: publishDate
        label: Publish Date
        type: string
        
      - name: category
        label: Category
        type: string
        
      - name: tags
        label: Tags
        type: list
        items:
          type: string
        
      - name: readTime
        label: Read Time
        type: string
        
      - name: featured
        label: Featured
        type: boolean
        default: false
        
      - name: published
        label: Published
        type: boolean
        default: true
        
      - name: featuredImage
        label: Featured Image
        type: string
        
      - name: tldr
        label: TL;DR
        type: text
        
      # Content body
      - name: body
        label: Content
        type: rich-text
        
    # Collection view configuration
    view:
      fields: [title, category, publishDate, featured]
      primary: title